global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'rate-limiter-monitor'

scrape_configs:
  # The service exposes /metrics on its main HTTP port. The previous config
  # scraped :9090, a port nothing ever listened on -- the dashboards it fed had
  # been empty since the day they were written.
  - job_name: 'rate-limiter-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:3000']
        labels:
          service: 'rate-limiter'

  # Redis speaks RESP, not HTTP; scraping it directly yields nothing. Reaching
  # Redis metrics needs redis_exporter alongside it, which docker-compose.yml
  # now runs.
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
