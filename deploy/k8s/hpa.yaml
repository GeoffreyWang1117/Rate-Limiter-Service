apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: llm-admission
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 40% of the one-core request, derived from the benchmark rather
          # than picked as a round number. Measured gateway CPU is 30% of a
          # core at 1,000 admission cycles/s, and 1,000 is the published
          # per-replica capacity -- the rate whose tail survived two separate
          # runs. 50% is 2,000 cycles/s, where the tail has already widened.
          #
          # So the target has to sit just above 30%, not comfortably above it:
          # a threshold of 60% would only add a replica somewhere past 2,400
          # cycles/s, which is the repository publishing one capacity figure
          # and then configuring for more than twice it. 40% adds the replica
          # shortly after a pod passes its stated capacity, and leaves the
          # remaining 60% of the core as headroom for the burst that keeps
          # arriving during the ~15s the new pod needs to pass its startup
          # probe.
          averageUtilization: 40
  behavior:
    scaleUp:
      # Admission traffic arrives in bursts by nature -- that is the workload
      # this service exists for -- so scaling up is allowed to be abrupt.
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
    scaleDown:
      # Slow, and deliberately asymmetric with scale-up. Removing a replica
      # during a lull that turns out to be the gap between two bursts costs a
      # cold start on the next one.
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
